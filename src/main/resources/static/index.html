<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pip-Boy 3000</title>
    <link rel="stylesheet" href="/pipboy.css">
</head>

<body>

<div class="screen">

    <header>
        <div class="brand">PIP-BOY 3000</div>
        <div class="status">
            <span id="clock"></span>
            <span class="online">● ONLINE</span>
        </div>
    </header>

    <main>

        <section class="title-panel">
            <div class="small-label">DATA // PARTY PROFILE</div>
            <h1 id="party-title">LOADING...</h1>
        </section>

        <nav class="tabs">
            <button class="tab active" data-tab="data">DATA</button>
            <button class="tab" data-tab="radio">RADIO</button>
            <button class="tab" data-tab="quest">QUEST</button>
        </nav>

        <section id="data" class="tab-content active">

            <div class="section">
                <h2>FOOD</h2>
                <div id="food" class="items"></div>
            </div>

            <div class="section">
                <h2>TREATS</h2>
                <div id="treats" class="items"></div>
            </div>

            <div class="section">
                <h2>BEVERAGES</h2>
                <div id="beverages" class="items"></div>
            </div>

        </section>

        <section id="radio" class="tab-content">

            <div class="radio">
                <div class="radio-title">☢ NUKA RADIO ☢</div>

                <div class="now-playing">NOW PLAYING</div>
                <div id="now-playing" class="song">SIGNAL ACQUIRING...</div>

                <div class="radio-controls">
                    <button>◀◀</button>
                    <button class="play">▶</button>
                    <button>▶▶</button>
                </div>

                <div class="signal">
                    SIGNAL
                    <span>████████████░░</span>
                </div>
            </div>

        </section>

        <section id="quest" class="tab-content">

            <div class="quest">
                <div class="quest-header">QUEST</div>

                <h2>SURVIVE THE BIRTHDAY</h2>

                <div class="objective">
                    ☑ Locate Brahmin Burgers
                </div>

                <div class="objective">
                    ☑ Acquire Nuka-Cola
                </div>

                <div class="objective">
                    ☐ Consume Dandy Boy Cake
                </div>

                <div class="objective">
                    ☐ Avoid Deathclaws
                </div>
            </div>

        </section>

    </main>

    <footer>
        <span>STAT</span>
        <span>INV</span>
        <span class="selected">DATA</span>
        <span>MAP</span>
        <span>RADIO</span>
    </footer>

</div>

<script src="/pipboy.js"></script>

</body>
</html>
